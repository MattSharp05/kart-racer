name: SQL

# The leaderboard's SQL (MK-48): applies every migration to a throwaway Postgres, twice (they must
# be safe to re-run), then runs supabase/tests. No Supabase account involved.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sql:
    name: SQL (leaderboard)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - run: scripts/test-sql.sh
