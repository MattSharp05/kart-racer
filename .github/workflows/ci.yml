name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:perf
      - run: pnpm build
      - run: pnpm check:bundle

  # Does this change touch anything the browser tests exercise? Docs/config-only PRs skip e2e and
  # visual (a settings-file PR once spent 20 min on e2e). Pushes to main always run everything.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$changed"
          # Anything outside docs, markdown and Claude settings counts as an app change.
          app=$(echo "$changed" | grep -vE '^(docs/|\.claude/)|\.md$' | head -1)
          echo "app=$([ -n "$app" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  e2e:
    # One job per Playwright project, in parallel (they used to run one after another: ~20 min).
    # The multi-page online specs have their own `*-online` projects and jobs (MK-80), so they
    # run one at a time on a runner of their own instead of starving each other and the rest.
    name: E2E (${{ matrix.project }})
    needs: [checks, changes]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: desktop-chrome, browser: chromium }
          - { project: desktop-chrome-online, browser: chromium }
          - { project: pixel-landscape, browser: chromium }
          - { project: desktop-webkit, browser: webkit }
          - { project: desktop-webkit-online, browser: webkit }
          - { project: iphone-landscape, browser: webkit }
          - { project: ipad, browser: webkit }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm test:e2e --project=${{ matrix.project }}
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report
          retention-days: 7

  visual:
    name: Visual (screenshot baselines)
    needs: [checks, changes]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    # Same image every time so screenshots are pixel-comparable (docs/TDD.md → Testing).
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run visual tests (or regenerate baselines on manual runs)
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pnpm test:visual --update-snapshots
          else
            pnpm test:visual
          fi
        env:
          CI: 'true'
          HOME: /root
      # Manual runs publish fresh baselines; download them with `gh run download` and commit to the PR branch.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-snapshots
          path: |
            tests/visual/__screenshots__
            test-results
          retention-days: 7
