name: CI

# Two levels (MK-89):
# - Pull requests run a fast gate, every job ≤ 5 min, in parallel: lint/types/build, unit, and
#   desktop-chrome e2e without the long `@full` tests (split over two runners). Other browser jobs,
#   netsoak and visual only run when the PR touches what they test.
# - Pushes to main (and manual runs) run the full suite: every device, `@full` tests, netsoak,
#   visual. A red main is fixed before anything else merges.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What does this change touch? Decides which of the slower jobs a PR needs.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.diff.outputs.full }}
      app: ${{ steps.diff.outputs.app }}
      net: ${{ steps.diff.outputs.net }}
      visual: ${{ steps.diff.outputs.visual }}
      e2e: ${{ steps.diff.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          # Pushes to main and manual runs: everything.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            full=true; app=true; net=true; visual=true
          else
            changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
            echo "$changed"
            has() { echo "$changed" | grep -qE "$1" && echo true || echo false; }
            # CI, test config or dependency changes can affect every job: run the full suite.
            full=$(has '^(\.github/|playwright(\.visual)?\.config\.ts$|vite\.config|package\.json$|pnpm-lock\.yaml$|tsconfig)')
            # Anything outside docs, markdown and Claude settings counts as an app change.
            app=$(echo "$changed" | grep -vE '^(docs/|\.claude/)|\.md$' | grep -q . && echo true || echo false)
            net=$(has '^(src/net/|supabase/|tests/e2e/online|tests/e2e/(lobby|rooms|netSpike)|src/ui/screens/(online|lobby|connectionLost))')
            # UI, input, styles and rendering: phone layout (iPhone) and screenshots.
            visual=$(has '^(src/ui/|src/input/|src/render/|src/content/.*/render|index\.html|src/.*\.css$|tests/visual/)')
            if [ "$full" = true ]; then app=true; net=true; visual=true; fi
          fi
          # Browser jobs for this run, as a matrix.
          if [ "$full" = true ]; then
            e2e='[
              {"project":"desktop-chrome","browser":"chromium","args":"--shard=1/2"},
              {"project":"desktop-chrome","browser":"chromium","args":"--shard=2/2"},
              {"project":"desktop-chrome-online","browser":"chromium","args":""},
              {"project":"desktop-webkit","browser":"webkit","args":""},
              {"project":"desktop-webkit-online","browser":"webkit","args":""},
              {"project":"iphone-landscape","browser":"webkit","args":""},
              {"project":"ipad","browser":"webkit","args":""}]'
          else
            e2e='[
              {"project":"desktop-chrome","browser":"chromium","args":"--shard=1/2 --grep-invert @full"},
              {"project":"desktop-chrome","browser":"chromium","args":"--shard=2/2 --grep-invert @full"}'
            [ "$visual" = true ] && e2e="$e2e"',{"project":"iphone-landscape","browser":"webkit","args":"--grep-invert @full"}'
            [ "$net" = true ] && e2e="$e2e"',{"project":"desktop-chrome-online","browser":"chromium","args":"--grep-invert @full"}'
            e2e="$e2e]"
          fi
          {
            echo "full=$full"; echo "app=$app"; echo "net=$net"; echo "visual=$visual"
            echo "e2e=$(echo "$e2e" | tr -d '\n' | tr -s ' ')"
          } >> "$GITHUB_OUTPUT"

  checks:
    name: Lint, types, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      # `pnpm build` would type-check a second time.
      - run: pnpm exec vite build
      - run: pnpm check:bundle

  unit:
    name: Unit + sim perf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:perf

  # The racer balance smoke (MK-88): 20 full 8-AI races, ~2 min of CPU, beside the unit job.
  balance:
    name: Racer balance smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:balance

  # The netcode soak: always on main, on PRs only when netcode changes.
  netsoak:
    name: Net soak
    needs: changes
    if: needs.changes.outputs.net == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:netsoak

  e2e:
    # Runs alongside the other jobs (it used to wait for them). The online specs have their own
    # `*-online` projects, one test at a time (MK-80).
    name: E2E (${{ matrix.project }} ${{ matrix.args }})
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.e2e) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm test:e2e --project=${{ matrix.project }} ${{ matrix.args }}
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}-${{ strategy.job-index }}
          path: playwright-report
          retention-days: 7

  visual:
    name: Visual (screenshot baselines)
    needs: changes
    if: needs.changes.outputs.visual == 'true'
    runs-on: ubuntu-latest
    # Same image every time so screenshots are pixel-comparable (docs/TDD.md → Testing).
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run visual tests (or regenerate baselines on manual runs)
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pnpm test:visual --update-snapshots
          else
            pnpm test:visual
          fi
        env:
          CI: 'true'
          HOME: /root
      # Manual runs publish fresh baselines; download them with `gh run download` and commit to the PR branch.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-snapshots
          path: |
            tests/visual/__screenshots__
            test-results
          retention-days: 7
